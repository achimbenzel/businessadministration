<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Aufbau des Produktzeichens: obere Grenze n, Laufindex i mit Startwert 1, Faktor a_i">
<title>Aufbau des Produktzeichens: obere Grenze n, Laufindex i mit Startwert 1, Faktor a_i</title>
<defs><marker id="arr-bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#131316"/></marker><marker id="arr-text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ececef"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a8b0"/></marker><marker id="arr-faint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b75"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ec5d3"/></marker><marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f472b6"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#a8a8b0" stroke-opacity="0.5" stroke-width="2"/></pattern></defs>
<rect width="640" height="372" fill="#131316"/>
<text x="24" y="34" font-size="17" fill="#ececef" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Produktzeichen (Pi)</tspan></text>
<text x="160" y="236" font-size="150" fill="#ececef" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', Menlo, Consolas, monospace"><tspan>Π</tspan></text>
<text x="160" y="86" font-size="40" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace"><tspan>n</tspan></text>
<text x="160" y="306" font-size="36" fill="#2ec5d3" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace"><tspan>i=1</tspan></text>
<text x="238" y="216" font-size="62" fill="#f472b6" text-anchor="start" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace"><tspan>a</tspan><tspan dy="13.6" font-size="68%">i</tspan></text>
<text x="370" y="66" font-size="17" fill="#fbbf24" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>obere Grenze: bis wohin?</tspan></text>
<text x="370" y="88" font-size="15" fill="#a8a8b0" text-anchor="start" font-weight="500" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>(Endwert)</tspan></text>
<line x1="362" y1="72" x2="190" y2="74" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arr-amber)"/>
<text x="370" y="178" font-size="17" fill="#f472b6" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Faktor: was multipliziert wird</tspan></text>
<text x="370" y="200" font-size="15" fill="#a8a8b0" text-anchor="start" font-weight="500" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>(hängt meist von i ab)</tspan></text>
<line x1="362" y1="186" x2="322" y2="194" stroke="#f472b6" stroke-width="2.2" marker-end="url(#arr-pink)"/>
<text x="370" y="290" font-size="17" fill="#2ec5d3" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Laufindex i und Startwert:</tspan></text>
<text x="370" y="312" font-size="15" fill="#a8a8b0" text-anchor="start" font-weight="500" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>ab wo? (untere Grenze)</tspan></text>
<line x1="362" y1="296" x2="214" y2="296" stroke="#2ec5d3" stroke-width="2.2" marker-end="url(#arr-teal)"/>
<text x="24" y="354" font-size="18" fill="#a8a8b0" text-anchor="start" font-weight="500" font-family="'JetBrains Mono', Menlo, Consolas, monospace"><tspan>Π a</tspan><tspan dy="4.0" font-size="68%">i</tspan><tspan dy="-4.0"> = a</tspan><tspan dy="4.0" font-size="68%">1</tspan><tspan dy="-4.0"> · a</tspan><tspan dy="4.0" font-size="68%">2</tspan><tspan dy="-4.0"> · … · a</tspan><tspan dy="4.0" font-size="68%">n</tspan></text>
</svg>
