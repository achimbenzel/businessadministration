<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="740" height="320" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dritte binomische Formel: Vom Quadrat a² wird b² weggenommen; die beiden Reststücke ergeben ein Rechteck (a + b) mal (a − b)">
