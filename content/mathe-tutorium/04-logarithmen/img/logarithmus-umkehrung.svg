<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Potenz und Logarithmus: 2 hoch 3 gleich 8, also Logarithmus zur Basis 2 von 8 gleich 3">
<title>Potenz und Logarithmus: 2 hoch 3 gleich 8, also Logarithmus zur Basis 2 von 8 gleich 3</title>
<defs><marker id="arr-bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#131316"/></marker><marker id="arr-text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ececef"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a8b0"/></marker><marker id="arr-faint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b75"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ec5d3"/></marker><marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f472b6"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#a8a8b0" stroke-opacity="0.5" stroke-width="2"/></pattern></defs>
<rect width="640" height="330" fill="#131316"/>
<text x="24" y="38" font-size="20" fill="#ececef" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Der Logarithmus sucht die Hochzahl</tspan></text>
<text x="24" y="104" font-size="19" fill="#a8a8b0" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Potenz</tspan></text>
<text x="200" y="110" font-size="44" text-anchor="start" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace"><tspan fill="#2ec5d3">2</tspan><tspan fill="#fbbf24" dy="-17.6" font-size="68%">3</tspan><tspan fill="#ececef" dy="17.6"> = </tspan><tspan fill="#f472b6">8</tspan></text>
<text x="200" y="146" font-size="18" fill="#a8a8b0" text-anchor="start" font-weight="500" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Hochzahl bekannt → Ergebnis gesucht</tspan></text>
<text x="24" y="214" font-size="19" fill="#a8a8b0" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Logarithmus</tspan></text>
<text x="200" y="220" font-size="44" text-anchor="start" font-weight="700" font-family="'JetBrains Mono', Menlo, Consolas, monospace"><tspan fill="#ececef">log</tspan><tspan fill="#2ec5d3" dy="9.7" font-size="68%">2</tspan><tspan fill="#ececef" dy="-9.7">(</tspan><tspan fill="#f472b6">8</tspan><tspan fill="#ececef">) = </tspan><tspan fill="#fbbf24">3</tspan></text>
<text x="200" y="256" font-size="18" fill="#a8a8b0" text-anchor="start" font-weight="500" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Ergebnis bekannt → Hochzahl gesucht</tspan></text>
<text x="24" y="310" font-size="18" fill="#2ec5d3" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Basis</tspan></text>
<text x="94" y="310" font-size="18" fill="#fbbf24" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Hochzahl</tspan></text>
<text x="194" y="310" font-size="18" fill="#f472b6" text-anchor="start" font-weight="700" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>Ergebnis</tspan></text>
<text x="290" y="310" font-size="18" fill="#a8a8b0" text-anchor="start" font-weight="500" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><tspan>– gleiche Farbe, gleiche Zahl</tspan></text>
</svg>
